<!doctype html><html lang="vi"><meta charset="utf-8"><title>Xưởng hiệu ứng — Giữ Cổng Thành</title><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1">
<style>body{margin:0;background:#18271f;color:#f1e2bc;font:16px system-ui;text-align:center}h1{font-size:22px}button,a{background:#344a36;color:#ffe7b1;border:1px solid #ad9561;padding:10px;margin:4px;cursor:pointer}canvas{max-width:100%;height:auto}p{font-size:14px}</style>
<h1>Xưởng hiệu ứng kỹ năng</h1><p><a href="/shadow-gallery.html">Sát thủ, Dạ Tiễn và Tinh linh cây — hiệu ứng mới</a></p><p><a href="/actor-lab.html">Xem nhân vật cường hóa và động tác Hộ vệ</a></p><p>Chọn kỹ năng để xem chuyển động. Khiên và cường hóa tồn tại quanh nhân vật trong thời gian hiệu lực.</p><label>Trạng thái: <select id="status-preview"><option value="none">Không có</option><option value="healing">Hồi máu</option><option value="drain">Hút máu</option><option value="shield">Khiên xoay</option><option value="stun">Choáng</option><option value="poison">Trúng độc</option><option value="ice">Chậm do băng</option><option value="fire">Chậm do lửa</option><option value="physical">Chậm vật lý</option><option value="speed">Tăng tốc chạy</option><option value="haste">Tăng tốc đánh</option><option value="power">Cường hóa</option></select></label><nav id="buttons"></nav><div id="stage"></div><p><a href="/">Về trò chơi</a></p>
<script src="/vendor/phaser.js"></script><script type="module">
import {renderEvent,updateVFX,unitVFX} from './effects.js';
const catalog=await(await fetch('/catalog-v4.json')).json();
const names={'assassin-double':'Sát thủ Q — Song Đao','assassin-veil':'Sát thủ E — Ảnh Bộ','assassin-flurry':'Sát thủ R — Ảnh Trảm',cleave:'Chiến binh Q — Bổ Rìu',earthquake:'Chiến binh R — Địa Chấn',multishot:'Cung thủ Q — Liên Tiễn',venom:'Cung thủ E — Độc Tiễn','arrow-rain':'Cung thủ R — Vũ Tiễn','chain-lightning':'Lôi sư Q — Lôi Liên',thunderstrike:'Lôi sư E — Lôi Kích',tempest:'Lôi sư R — Lôi Trận','shield-bash':'Hộ vệ Q — Khiên Chấn',bulwark:'Hộ vệ E — Thành Đồng',rally:'Hộ vệ R — Hiệu Triệu',fury:'Chiến binh E — Cuồng Huyết',fireburst:'Hỏa Bộc',flamefield:'Biển Lửa',meteor:'Thiên Thạch',frostnova:'Hàn Triều','healing-tide':'Thủy Dưỡng',blizzard:'Băng Vực'};
let scene,id=0,active=null,remaining=0;const seen=new Set();
for(const [key,name]of Object.entries(names)){const b=document.createElement('button');b.textContent=name;b.disabled=true;b.onclick=()=>{if(!scene?.add)return;if(key.startsWith('assassin-')){renderEvent(scene,{id:++id,type:key==='assassin-double'?'assassin-vfx':'shadow-vfx',action:key==='assassin-double'?'double':key==='assassin-veil'?'blink':'dash-slash',x:360,y:290,angle:0,color:0xc4d79b},seen);return;}active=key;remaining=['bulwark','rally','fury'].includes(key)?6:0;if(remaining)return;renderEvent(scene,{id:++id,type:key==='meteor'?'meteor-fall':key==='chain-lightning'?'lightning':key==='venom'?'projectile':'aoe',skill:key,projectileType:key==='venom'?'venom':undefined,tx:530,ty:290,x:360,y:290,radius:135,previewDuration:2.5,duration:1.1,color:['fireburst','flamefield','meteor','fury'].includes(key)?0xffac65:['shield-bash','rally','bulwark'].includes(key)?0xffdc94:0xa3eaff},seen);if(key==='meteor')scene.time.delayedCall(1100,()=>renderEvent(scene,{id:++id,type:'meteor-impact',x:360,y:290,radius:145,color:0xffac65},seen));};document.querySelector('#buttons').append(b);}
new Phaser.Game({type:Phaser.AUTO,width:720,height:470,parent:'stage',backgroundColor:'#2a3e30',scene:{
 preload(){for(const a of catalog.spellArt||[])this.load.image('art:'+a.id,a.url);for(const fx of catalog.effects)this.load.spritesheet('fx:'+fx.id,fx.url,{frameWidth:fx.frame,frameHeight:fx.frame});const a=catalog.actors.find(a=>a.id==='knight-1');this.heroInfo=a;this.load.spritesheet('hero',a.actions.idle.url,{frameWidth:a.frame,frameHeight:a.frame});},
 create(){scene=this;for(const b of document.querySelectorAll('#buttons button'))b.disabled=false;for(const fx of catalog.effects)this.anims.create({key:'fx:'+fx.id,frames:this.anims.generateFrameNumbers('fx:'+fx.id,{start:0,end:fx.frames-1}),frameRate:15,repeat:0});this.add.grid(360,235,720,470,32,32,0x2a3e30,1,0x78926c,.09);this.unitGlow=this.add.graphics().setDepth(2800);this.unitGround=this.add.graphics().setDepth(2);this.sprite=this.add.sprite(360,290,'hero').setScale(64/this.heroInfo.bodyHeight).setOrigin(this.heroInfo.originX,this.heroInfo.originY).setDepth(1800);this.obj={sprite:this.sprite,groundY:290,size:64};this.actorObjects=new Map([['preview',this.obj]]);this.label=this.add.text(360,425,'Chọn một kỹ năng bên trên',{fontSize:'17px',color:'#ffe7b1'}).setOrigin(.5);},
 update(time,delta){
 remaining=Math.max(0,remaining-delta/1000);this.unitGlow.clear();this.unitGround.clear();const status=document.querySelector('#status-preview').value;
 const buffs=[];if(remaining)buffs.push(active==='fury'?{time:remaining,lifesteal:.25,haste:.3}:active==='rally'?{time:remaining,aura:'rally',haste:.2}:{time:remaining,shield:true});
 if(status==='haste')buffs.push({time:1,haste:.3});if(status==='speed')buffs.push({time:1,speed:.3});if(status==='power')buffs.push({time:1,lifesteal:.2});
 this.sprite.x=status==='speed'?360+Math.sin(time/600)*100:360;
 unitVFX(this,{id:'preview',hp:100,stats:{hp:100},hero:'knight-1',face:1,classId:active==='fury'?'berserker':'guardian',shield:remaining&&active==='bulwark'||status==='shield'?100:0,buffs,stun:status==='stun'?1:0,poisonTime:status==='poison'?1:0,slowTime:['ice','fire','physical'].includes(status)?1:0,slowType:status},this.obj,time);
 if(['healing','drain'].includes(status)&&time-(this.lastHeal||0)>1000){this.lastHeal=time;renderEvent(this,{id:++id,type:'healing',targetId:'preview',x:this.sprite.x,y:265,amount:12,drainFrom:status==='drain'?{x:520,y:260}:null},seen);}
 updateVFX(this,delta/1000);this.label.setText(active?(names[active]+(remaining?' · '+remaining.toFixed(1)+'s':'')):'Xem thử trạng thái nhân vật');
 }
}});
</script></html>
