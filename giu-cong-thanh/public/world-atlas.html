<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bản đồ lãnh địa · Ẩn Thành</title><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1"><link rel="stylesheet" href="/bestiary.css"><style>h1{font-size:36px}select{padding:10px;background:#203a28;color:#dfd9b4;border:1px solid #7b8e60;font:inherit}#atlas svg{width:100%;max-height:65vh;background:#29402b;border:1px solid #687856;margin:20px 0}#legend{display:flex;gap:15px;flex-wrap:wrap;font-size:12px}#legend span{border-left:10px solid;padding-left:8px}p{color:#bdceb2;line-height:1.7;font-size:13px}</style><header><a class="brand" href="/">THE WORLD / LÃNH ĐỊA</a><nav><a href="/forest-leaders.html">Thủ lĩnh</a><a href="/defense.html">Chơi ↗</a></nav></header><main><h1>Chiến trường & lãnh địa</h1><select id="map-choice" aria-label="Chiến trường"></select><p id="map-info"></p><div id="atlas"></div><div id="legend"></div><p>Nước sâu chặn đường. Nước cạn −10% tốc chạy. Băng −35% tốc chạy, −25% tốc đánh. Dung nham/Lửa gây 3%/2% HP tối đa mỗi giây. Gió +20% tốc chạy, quái bay +25% sát thương. Rừng rậm: quái rừng +25% sát thương. Đất chết: −25% giáp.</p></main><script type="module">
import {MAPS} from './content.js';import {BIOMES} from './world-biomes.js';const $=id=>document.getElementById(id),hex=n=>'#'+n.toString(16).padStart(6,'0');for(const m of MAPS){const o=document.createElement('option');o.value=m.id;o.textContent=m.id+' · '+m.name;$('map-choice').append(o);}for(const b of Object.values(BIOMES)){const s=document.createElement('span');s.textContent=b.name;s.style.borderColor=hex(b.color);$('legend').append(s);}function draw(){const m=MAPS[Number($('map-choice').value)-1];$('map-info').textContent=m.width+' × '+m.height+' · Mở rộng '+m.expansion+' lần mỗi chiều · '+m.territories.length+' thủ lĩnh';$('atlas').innerHTML='<svg role="img" aria-label="Lãnh địa và địa hình '+m.name+'" viewBox="0 0 '+m.width+' '+m.height+'"><rect width="100%" height="100%" fill="'+hex(m.ground)+'"/>'+m.props.map(p=>'<circle cx="'+p.x+'" cy="'+p.y+'" r="25" fill="#1e3327" opacity=".5"/>').join('')+(m.rivers||[]).map(w=>'<polyline points="'+w.points.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+(w.type==='deep'?'#367a91':'#83c7c4')+'" stroke-width="'+w.width+'"/>').join('')+m.lanes.map(l=>'<polyline points="'+l.map(p=>p.join(',')).join(' ')+'" fill="none" stroke="'+hex(m.road)+'" stroke-width="65"/>').join('')+m.environment.map(z=>'<ellipse cx="'+z.x+'" cy="'+z.y+'" rx="'+z.rx+'" ry="'+z.ry+'" fill="'+hex(BIOMES[z.type].color)+'"/><text x="'+z.x+'" y="'+(z.y-z.ry-25)+'" fill="#f3efc5" font-size="65" text-anchor="middle">'+BIOMES[z.type].name+'</text>').join('')+m.territories.map(t=>'<circle cx="'+t.x+'" cy="'+t.y+'" r="'+t.radius+'" fill="'+hex(t.color)+'" fill-opacity=".2" stroke="'+hex(t.color)+'" stroke-width="14"/><text x="'+t.x+'" y="'+t.y+'" fill="#fff2bd" font-size="75" text-anchor="middle">'+t.name+'</text>').join('')+'<rect x="'+(m.base.x-120)+'" y="'+(m.base.y-150)+'" width="240" height="240" fill="#e2cd95"/><text x="'+m.base.x+'" y="'+(m.base.y-190)+'" fill="#fff0a9" font-size="75" text-anchor="middle">THÀNH CHÍNH</text></svg>';} $('map-choice').onchange=draw;draw();
</script></html>
