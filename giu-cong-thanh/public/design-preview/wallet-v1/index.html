<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ẩn Thành · Thiết kế Ví/Hạn mức</title>
<style>
:root{--base:#102019;--raised:#1c3025;--input:#0c1712;--hover:#2b4433;--border:#60705a;--gold:#b5a16a;--text:#eee6d0;--sub:#bdc5b2;--muted:#969f91;--focus:#b6daed;--success:#8fd18a;--warning:#e7c66a;--error:#ef938a}
*{box-sizing:border-box}body{margin:0;background:#09130e;color:var(--text);font:14px/1.45 Arial,sans-serif;font-variant-numeric:tabular-nums}button,input,select{font:inherit}button,select{color:var(--text);background:var(--raised);border:1px solid var(--border);min-height:36px;padding:6px 12px;cursor:pointer;border-radius:0}button:hover{background:var(--hover)}button:disabled{opacity:.55;cursor:not-allowed}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus);outline-offset:2px}button.active{border-color:var(--gold);box-shadow:inset 0 -2px var(--gold)}.primary{background:#a48b4d;color:#111b13;border-color:#b5a16a}.sub{color:var(--sub)}.muted{color:var(--muted)}.success{color:var(--success)}.warn{color:var(--warning)}.error{color:var(--error)}.mono{font-family:Consolas,monospace;font-size:13px}p{margin:0}h1,h2,h3{margin:0;font-weight:600}h1{font-size:20px}h2{font-size:22px}h3{font-size:16px}.board{min-height:720px;height:100vh;position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 45%,#1b2b20 0,#0c1811 67%)}.masthead{position:absolute;left:32px;right:32px;top:20px;display:flex;justify-content:space-between;gap:16px}.eyebrow{color:var(--gold);font-size:13px;letter-spacing:1.2px;text-transform:uppercase}.masthead .note{text-align:right;color:var(--sub);font-size:13px}.masthead p{font-size:13px;color:var(--muted);margin-top:3px}.workspace{position:absolute;inset:74px 16px 76px;display:flex;align-items:center;justify-content:center}.wallet{position:relative;width:640px;height:540px;max-width:100%;background:var(--base);border:2px solid var(--border);box-shadow:4px 4px 0 #050d08;display:grid;grid-template-rows:44px 30px 42px minmax(0,1fr) 36px}.wallet::before{position:absolute;content:"";width:8px;height:8px;border:2px solid var(--gold);background:var(--base);top:-5px;left:14px}.window-head{display:flex;justify-content:space-between;align-items:center;padding:0 14px;border-bottom:1px solid var(--border)}.window-head h2{display:flex;gap:10px;align-items:center}.title-mark{color:var(--gold);font-size:18px}.close{padding:0;width:28px;min-height:28px;font-size:20px}.scopebar{background:var(--input);padding:4px 14px;display:flex;justify-content:space-between;color:var(--sub);font-size:13px}.tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--border);padding-left:14px;gap:4px}.tabs button{border:0;border-bottom:2px solid transparent;background:transparent;min-width:96px;padding:6px 12px}.tabs button.active{box-shadow:none;border-bottom-color:var(--gold);color:var(--gold)}.tabs .badge{margin-left:auto;align-self:center;margin-right:14px;color:var(--muted);font-size:13px}.content{padding:12px;overflow:auto;min-height:0}.window-foot{border-top:1px solid var(--border);padding:7px 14px;display:flex;justify-content:space-between;gap:12px;color:var(--sub);font-size:13px}.currency{display:grid;grid-template-columns:32px minmax(0,1fr) minmax(155px,185px);gap:12px;align-items:center;border:1px solid var(--border);background:var(--raised);padding:10px 12px;min-height:76px;margin-bottom:8px}.currency img{width:32px;height:32px;image-rendering:pixelated}.currency .label{font-size:16px;font-weight:600}.currency .scope{font-size:13px;color:var(--sub);margin-top:1px}.currency .money{text-align:right}.amount{font-size:23px;line-height:1.15;font-weight:600;white-space:nowrap}.amount.long{font-size:18px}.money .sub{font-size:13px;margin-top:4px}.micro{font-size:13px;color:var(--sub);margin-top:4px}.callout{border:1px solid var(--border);background:var(--input);padding:10px 12px;display:flex;align-items:center;justify-content:space-between;gap:12px}.callout p{font-size:13px;color:var(--sub);margin-top:3px}.callout button{flex:none;font-size:13px}.alert{border:1px solid var(--warning);padding:8px 12px;background:#292b1b;font-size:14px;margin-bottom:8px}.alert.error-box{border-color:var(--error);background:#30231d}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}.stat{border:1px solid var(--border);background:var(--raised);padding:8px}.stat span{display:block;font-size:13px;color:var(--sub)}.stat strong{font-size:22px;display:block;margin-top:2px}.block{border:1px solid var(--border);background:var(--raised);padding:10px;margin-bottom:8px}.block h3{margin-bottom:8px}.pair{display:flex;justify-content:space-between;gap:12px;margin:6px 0}.pair .sub{flex:1}.pair strong{white-space:nowrap}.line{height:1px;background:var(--border);margin:10px 0}.small{font-size:13px}.filters{display:flex;gap:8px;margin-bottom:10px;align-items:center}.filters select{min-width:138px;max-width:45%;font-size:13px}.filters input{min-width:0;flex:1;width:80px;background:var(--input);color:var(--text);border:1px solid var(--border);height:36px;padding:6px 8px}.history-layout{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;align-items:start}.history-table{border-collapse:collapse;width:100%;font-size:13px}.history-table th{text-align:left;color:var(--sub);font-weight:400;border-bottom:1px solid var(--border);padding:6px 8px;background:var(--input)}.history-table td{padding:8px;border-bottom:1px solid #344735}.history-table tr.selected td{background:var(--hover)}.history-table .right{text-align:right;white-space:nowrap}.history-table button{font-size:12px;padding:0 5px;min-height:24px;border-color:transparent;background:transparent}.pager{display:flex;justify-content:space-between;align-items:center;margin:8px 0;font-size:12px;color:var(--sub)}.receipt{border:1px solid var(--gold);padding:10px 12px;background:var(--input)}.receipt-head{display:flex;justify-content:space-between;gap:8px;margin-bottom:6px}.receipt .pair{font-size:13px;margin:4px 0}.dialog-shade{position:absolute;inset:44px 0 36px;background:#020904a8;display:flex;align-items:center;justify-content:center;padding:16px;z-index:4}.dialog{width:420px;max-width:100%;background:var(--base);border:2px solid var(--warning);box-shadow:4px 4px 0 #050d08;padding:16px}.dialog h3{font-size:19px;margin-bottom:8px}.dialog p{color:var(--sub);margin-bottom:10px}.dialog .buttons{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}.skeleton{height:16px;background:#354c3a;display:inline-block;min-width:70px}.amount .skeleton{width:125px;height:23px}.design-controls{position:absolute;bottom:15px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px}.scenes{display:flex;gap:5px;flex-wrap:wrap}.scenes button{font-size:13px;padding:6px 10px}.design-controls .variants{max-width:300px;text-align:right;font-size:12px;color:var(--sub)}.variants select{font-size:13px;margin-left:6px;padding:4px 6px;min-height:30px;max-width:190px}.reopen{border:1px solid var(--gold);padding:12px 24px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}[hidden]{display:none!important}@media(max-width:720px){.masthead{left:16px;right:16px}.masthead .note{max-width:180px}.eyebrow{font-size:11px}.masthead h1{font-size:16px}.workspace{inset:94px 10px 106px}.wallet{max-height:100%;height:540px}.currency{grid-template-columns:32px minmax(0,1fr) minmax(110px,150px);padding:9px 8px;gap:8px}.currency .label{font-size:14px}.amount{font-size:20px}.amount.long{font-size:14px}.currency .scope,.money .sub{font-size:12px}.design-controls{left:12px;right:12px;bottom:10px;display:block}.design-controls .variants{max-width:none;text-align:left;margin-top:6px}.scopebar{font-size:12px}.stats{gap:4px}.stat{padding:8px 5px}.stat strong{font-size:20px}.callout{align-items:flex-start}.callout button{padding:4px 7px}.window-foot{font-size:11px}.filters select{min-width:110px}.history-table{font-size:12px}.history-table td{padding:6px}.history-layout{grid-template-columns:minmax(0,1fr)}.history-layout .receipt{margin-top:2px}.history-table .time{display:none}.tabs .badge{font-size:11px;margin-right:8px}.dialog{padding:12px}.scenes button{font-size:12px;padding:4px 7px;min-height:30px}}
</style>
</head>
<body>
<div class="board">
 <header class="masthead"><div><div class="eyebrow">Ẩn Thành · MMORPG · Pixel V4</div><h1>Hồ sơ giao diện / Ví & hạn mức</h1></div><div class="note">CUR-08 · MẪU THIẾT KẾ<p>Dữ liệu minh họa · Không giao dịch thật</p></div></header>
 <main class="workspace"><section id="wallet" class="wallet" aria-label="Ví và hạn mức"></section><button class="reopen" id="reopen" hidden>Mở ví mẫu</button></main>
 <footer class="design-controls"><div><div class="scenes" aria-label="Chọn bản thiết kế"><button data-scene="overview">A · Số dư</button><button data-scene="history">B · Lịch sử</button><button data-scene="pending">C · Giữ / chờ / thiếu</button><button data-scene="scope">D · Scope / lỗi</button></div></div><label class="variants">Biến thể minh họa<select id="variant"><option value="ready">Trạng thái chính</option><option value="loading">Đang tải</option><option value="empty">Ví trống</option><option value="restricted">Bị hạn chế</option><option value="long">Số dài / trần ví</option></select></label></footer>
</div>
<script>
const $=id=>document.getElementById(id),params=new URLSearchParams(location.search),validScenes=['overview','history','pending','scope'],validVariants=['ready','loading','empty','restricted','long'];
let scene=validScenes.includes(params.get('scene'))?params.get('scene'):'overview',variant=validVariants.includes(params.get('variant'))?params.get('variant'):'ready',dialogOpen=true,detailsOpen=false,closed=false;
const format=x=>new Intl.NumberFormat('vi-VN').format(x),icons={premium:'../../assets/mmorpg/currency/r002/currency_premium_crystal_32__r002.png',bound:'../../assets/mmorpg/currency/r002/currency_bound_seal_32__r002.png',coin:'../../assets/mmorpg/currency/r002/currency_elarion_coin_32__r002.png'};
function moneyRow(key,name,scope,amount,held,pending,unavailable=false){const loading=variant==='loading',empty=variant==='empty';if(variant==='long'&&!unavailable)amount=key==='premium'?1000000000:1000000000000;else if(empty)amount=held=pending=0;return `<article class="currency"><img alt="" src="${icons[key]}" width="32" height="32"><div><div class="label">${name}</div><div class="scope">${scope}</div></div><div class="money"><div class="amount ${variant==='long'?'long':''}" aria-label="${unavailable?'Chưa có dữ liệu':name+' khả dụng'}">${loading?'<span class="skeleton" aria-label="Đang tải"></span>':unavailable?'—':format(amount)}</div><div class="sub">${unavailable?'Chưa tải được':loading?'Đang cập nhật':`Giữ ${format(held)} · Chờ ${format(pending)}`}</div></div></article>`;}
function overview(){return `${variant==='restricted'?'<div class="alert error-box"><strong>! Ví đang được đối soát</strong><br>Chưa thể thực hiện thanh toán. Xem biên nhận để liên hệ hỗ trợ.</div>':''}${moneyRow('premium','Tinh Thạch','Toàn tài khoản · mọi chế độ',2400,0,0)}${moneyRow('bound','Ngân Ấn','MMORPG · Elarion-01',700,300,200)}${moneyRow('coin','Đồng Elarion','MMORPG · Elarion-01',12500,0,0)}${variant==='restricted'?'':`<div class="callout"><div><strong>Nguồn phát hành Đồng Elarion</strong><p>${variant==='empty'?'Ví chưa có tiền. Xem nguồn kiếm đang mở.':'Nguồn phát hành mới chưa mở.'}</p></div><button id="source-detail">Nguồn & nơi dùng</button></div>`}`;}
function historyView(){return `<div class="filters"><label class="sr" for="currency-filter">Loại tiền</label><select id="currency-filter"><option>Ngân Ấn</option><option>Tinh Thạch</option><option>Đồng Elarion</option></select><label class="sr" for="receipt-search">Tìm mã biên nhận</label><input id="receipt-search" placeholder="Tìm mã biên nhận" aria-label="Tìm mã biên nhận"><span class="sub small">22/10/2026</span></div><div class="history-layout"><section><table class="history-table"><thead><tr><th class="time">Giờ</th><th>Khoản giao dịch</th><th class="right">Số tiền</th><th>Trạng thái</th></tr></thead><tbody><tr class="selected"><td class="time">09:43</td><td>Giữ cho dịch vụ tại trạm</td><td class="right warn">300</td><td class="warn">Đang giữ</td></tr><tr><td class="time">09:42</td><td>Thưởng nhiệm vụ</td><td class="right success">+200</td><td>Đã nhận</td></tr><tr><td class="time">09:41</td><td>Dịch vụ tại trạm</td><td class="right">−100</td><td>Đã chi</td></tr><tr><td class="time">09:40</td><td>Thưởng nhiệm vụ</td><td class="right success">+900</td><td>Đã nhận</td></tr></tbody></table><div class="pager"><span>4 giao dịch · tối đa 25 dòng/trang</span><span>‹ 1 / 1 ›</span></div></section><article class="receipt"><div class="receipt-head"><strong>Biên nhận đang chọn</strong><span class="warn">◷ Đang giữ</span></div><div class="mono">DEMO-20261022-004</div><div class="pair"><span class="sub">Tiền / server</span><span>Ngân Ấn · Elarion-01</span></div><div class="pair"><span class="sub">Đã ghi sổ</span><span>1.000 → 1.000</span></div><div class="pair"><span class="sub">Đang giữ</span><span>0 → 300</span></div><div class="pair"><span class="sub">Khả dụng</span><strong>1.000 → 700</strong></div><div class="micro">Giữ tiền chưa phải chi tiền. Gửi lại yêu cầu không tạo lần chi mới.</div></article></div>`;}
function pendingView(){return `<div class="stats"><div class="stat"><span>Đã ghi sổ</span><strong>1.000</strong></div><div class="stat"><span>Đang giữ</span><strong class="warn">300</strong></div><div class="stat"><span>Khả dụng</span><strong>700</strong></div><div class="stat"><span>Chờ nhận</span><strong>200</strong></div></div><div class="block"><h3>Ngân Ấn · Elarion-01</h3><div class="pair"><span class="sub">Khoản đang giữ</span><strong>300 Ngân Ấn</strong></div><p class="small sub">Dịch vụ tại trạm · đang chờ kết quả.</p><div class="line"></div><div class="pair"><span class="sub">Quà đang chờ nhận</span><strong>200 Ngân Ấn</strong></div><p class="small sub">Chưa cộng vào số dư. Nhận tại nơi an toàn khi đủ điều kiện.</p></div><div class="alert"><strong>! Tiền chờ chưa thể thanh toán</strong><br>Đóng cửa sổ không tự hủy giao dịch đã gửi.</div><button id="show-shortage">Xem ví dụ thiếu tiền</button>`;}
function scopeView(){return `<div class="alert error-box"><strong>! Chưa tải được ví Elarion-02</strong><br>Báo giá cũ không còn hiệu lực. Chưa thể thanh toán.</div>${moneyRow('premium','Tinh Thạch','Toàn tài khoản · không đổi theo server',2400,0,0)}${moneyRow('bound','Ngân Ấn','Elarion-02 · dữ liệu chưa sẵn sàng',0,0,0,true)}${moneyRow('coin','Đồng Elarion','Elarion-02 · dữ liệu chưa sẵn sàng',0,0,0,true)}<div style="display:flex;justify-content:space-between;align-items:center;gap:12px"><span class="small sub">Không hiển thị số dư Elarion-01 thay thế.</span><button id="retry">Thử lại</button></div>`;}
function shortage(){return `<div class="dialog-shade"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="shortage-title"><h3 id="shortage-title" class="warn">! Chưa đủ Ngân Ấn</h3><p>Ví dụ báo giá dịch vụ tại trạm</p><div class="pair"><span class="sub">Cần thanh toán</span><strong>900 Ngân Ấn</strong></div><div class="pair"><span class="sub">Hiện có thể tiêu</span><strong>700 Ngân Ấn</strong></div><div class="line"></div><div class="pair"><span class="sub">Còn thiếu</span><strong class="warn">200 Ngân Ấn</strong></div><p class="small" style="margin-top:12px">Không tự dùng Đồng Elarion hoặc Tinh Thạch để bù.</p><div class="buttons"><button id="dismiss-shortage">Quay lại</button><button class="primary" disabled>Thanh toán</button></div></section></div>`;}
function sourceDetails(){return `<div class="dialog-shade"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="source-title"><h3 id="source-title">Đồng Elarion</h3><p>Tiền giao dịch giữa người chơi trong cùng server.</p><div class="block"><strong>Nguồn phát hành mới chưa mở</strong><p class="small" style="margin:6px 0 0">Nguồn nhận và hạn mức sẽ được công bố trước khi tham gia.</p></div><p class="small">Không đổi từ Ngân Ấn hoặc Tinh Thạch. Số dư ví khác hạn mức kiếm tiền.</p><div class="buttons"><button id="dismiss-detail">Đã hiểu</button></div></section></div>`;}
function render(){const history=scene==='history',server=scene==='scope'?'Elarion-02':'Elarion-01';$('wallet').hidden=closed;$('reopen').hidden=!closed;$('variant').value=variant;document.querySelectorAll('[data-scene]').forEach(b=>{b.classList.toggle('active',b.dataset.scene===scene);b.setAttribute('aria-pressed',b.dataset.scene===scene)});$('wallet').innerHTML=`<header class="window-head"><h2><span class="title-mark" aria-hidden="true">◇</span> Ví & hạn mức</h2><button id="close-wallet" class="close" aria-label="Đóng cửa sổ ví">×</button></header><div class="scopebar"><span>MMORPG · ${server}</span><span>${scene==='scope'?'Đổi từ Elarion-01':'Tiền nạp dùng chung toàn tài khoản'}</span></div><nav class="tabs" aria-label="Tab ví"><button data-tab="overview" class="${!history?'active':''}" aria-current="${!history?'page':'false'}">Số dư</button><button data-tab="history" class="${history?'active':''}" aria-current="${history?'page':'false'}">Lịch sử</button><span class="badge">${scene==='scope'?'! Chưa cập nhật':'◷ Mẫu dữ liệu 09:43'}</span></nav><div class="content">${history?historyView():scene==='pending'?pendingView():scene==='scope'?scopeView():overview()}</div><footer class="window-foot"><span>${scene==='scope'?'Không thanh toán bằng số dư cũ':'Khả dụng = đã ghi sổ − đang giữ'}</span><span>Esc / ~ · Đóng</span></footer>${scene==='pending'&&dialogOpen?shortage():''}${detailsOpen?sourceDetails():''}`;
 if(history)activateHistory();$('close-wallet').onclick=closeWallet;document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>setScene(b.dataset.tab));$('source-detail')?.addEventListener('click',()=>{detailsOpen=true;render();$('dismiss-detail').focus()});$('dismiss-detail')?.addEventListener('click',()=>{detailsOpen=false;render();$('source-detail')?.focus()});$('show-shortage')?.addEventListener('click',()=>{dialogOpen=true;render();$('dismiss-shortage').focus()});$('dismiss-shortage')?.addEventListener('click',()=>{dialogOpen=false;render();$('show-shortage').focus()});$('retry')?.addEventListener('click',()=>{variant='loading';render();syncUrl()});$('wallet').onclick=e=>e.stopPropagation();$('wallet').onpointerdown=e=>e.stopPropagation();if(scene==='pending'&&dialogOpen)$('dismiss-shortage').focus();}
function activateHistory(){
 const records=[{id:'004',name:'Giữ cho dịch vụ tại trạm',status:'Đang giữ',before:'1.000',after:'1.000',holdBefore:'0',holdAfter:'300',availableBefore:'1.000',availableAfter:'700'},{id:'003',name:'Thưởng nhiệm vụ',status:'Đã nhận',before:'800',after:'1.000',holdBefore:'0',holdAfter:'0',availableBefore:'800',availableAfter:'1.000'},{id:'002',name:'Dịch vụ tại trạm',status:'Đã chi',before:'900',after:'800',holdBefore:'0',holdAfter:'0',availableBefore:'900',availableAfter:'800'},{id:'001',name:'Thưởng nhiệm vụ',status:'Đã nhận',before:'0',after:'900',holdBefore:'0',holdAfter:'0',availableBefore:'0',availableAfter:'900'}];
 const rows=[...document.querySelectorAll('.history-table tbody tr')],receipt=document.querySelector('.receipt'),pager=document.querySelector('.pager span');let chosen=0;
 function select(i){chosen=i;rows.forEach((r,j)=>r.classList.toggle('selected',i===j));const r=records[i];receipt.innerHTML=`<div class="receipt-head"><strong>Biên nhận đang chọn</strong><span class="${i===0?'warn':'success'}">${r.status}</span></div><div class="mono">DEMO-20261022-${r.id}</div><div class="pair"><span class="sub">Tiền / server</span><span>Ngân Ấn · Elarion-01</span></div><div class="pair"><span class="sub">Đã ghi sổ</span><span>${r.before} → ${r.after}</span></div><div class="pair"><span class="sub">Đang giữ</span><span>${r.holdBefore} → ${r.holdAfter}</span></div><div class="pair"><span class="sub">Khả dụng</span><strong>${r.availableBefore} → ${r.availableAfter}</strong></div><div class="micro">Giữ tiền chưa phải chi tiền. Gửi lại yêu cầu không tạo lần chi mới.</div>`;}
 rows.forEach((row,i)=>{row.cells[1].innerHTML=`<button aria-label="Xem biên nhận DEMO-20261022-${records[i].id}">${records[i].name}</button>`;row.cells[1].firstChild.onclick=()=>select(i)});
 function filter(){const query=$('receipt-search').value.toLowerCase(),bound=$('currency-filter').selectedIndex===0;const visible=[];rows.forEach((row,i)=>{const match=bound&&(`demo-20261022-${records[i].id} ${records[i].name}`.toLowerCase().includes(query));row.hidden=!match;if(match)visible.push(i)});pager.textContent=visible.length+' giao dịch · tối đa 25 dòng/trang';if(visible.length){if(!visible.includes(chosen))select(visible[0]);else select(chosen)}else{receipt.innerHTML='<strong>Không có giao dịch phù hợp</strong><p class="micro">Thử loại tiền hoặc mã biên nhận khác trong mẫu minh họa.</p>';rows.forEach(r=>r.classList.remove('selected'))}}
 $('receipt-search').oninput=filter;$('currency-filter').onchange=filter;select(0);
}
function syncUrl(){const u=new URL(location.href);u.searchParams.set('scene',scene);u.searchParams.set('variant',variant);history.replaceState(null,'',u)}
function setScene(s){scene=s;variant='ready';closed=false;detailsOpen=false;dialogOpen=true;render();syncUrl()}
function closeWallet(){closed=true;detailsOpen=false;render();$('reopen').focus()}
document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>setScene(b.dataset.scene));$('variant').onchange=e=>{variant=e.target.value;render();syncUrl()};$('reopen').onclick=()=>{closed=false;render();$('close-wallet').focus()};
document.addEventListener('keydown',e=>{if(e.isComposing)return;const text=/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName);if(e.key==='Tab'&&!closed){const modal=document.querySelector('[aria-modal="true"]');if(modal){const controls=[...modal.querySelectorAll('button:not(:disabled),input,select,[tabindex="0"]')];if(controls.length){const first=controls[0],last=controls.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}}if(e.key==='Escape'){e.preventDefault();if(detailsOpen){detailsOpen=false;render()}else if(scene==='pending'&&dialogOpen){dialogOpen=false;render()}else if(!closed)closeWallet()}else if(e.code==='Backquote'&&!text){e.preventDefault();if(!closed)closeWallet()}});
render();
</script>
