<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bình Minh · Cỏ, hoa và lá</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f5ed;color:#294333;font:16px/1.7 Segoe UI,sans-serif}main{max-width:1400px;margin:auto;padding:24px}a{color:#286747}.note{background:#eee8ce;padding:16px}.tools{display:flex;gap:16px;align-items:center;flex-wrap:wrap}select{font:inherit;padding:8px}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}article{padding:16px;background:#fff;border:1px solid #cbd7c0;min-width:0}h2{font-size:19px}img{display:block;width:160px;max-width:100%;height:auto;image-rendering:pixelated;background:#dce5cd;margin:auto}.small{font-size:13px;color:#64745c}@media(max-width:950px){.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:500px){main{padding:14px}.cards{grid-template-columns:1fr}}</style><main><a href="index.html">← Scene r007</a> · <a href="../v01-p0-scene-r006/tree-library.html">Bộ cây lớn</a><h1>Cỏ, hoa và lá · Bộ thử Bình Minh</h1><p class="note">16 sprite draft từ ba nguồn mới:6loại cỏ,6cụm hoa/trạng thái,3lá riêng và1thảm lá. Chưa native pixel cleanup hoặc vật phẩm thu thập. Xem trên nền sáng để kiểm viền alpha.</p><div class="tools"><label>Nhóm <select id="group"><option value="">Tất cả</option><option value="grass">Cỏ</option><option value="flowers">Hoa</option><option value="leaves">Lá</option></select></label><p id="count" role="status"></p></div><div id="cards" class="cards"></div><p id="error" role="alert"></p><p><a href="flora-manifest.json">Bounds/pivot</a> · <a href="provenance.json">Nguồn và prompt</a></p></main><script type="module">
const labels={'grass-short':['Cỏ thấp bị giẫm','Ven đường, không che lối'],'grass-meadow':['Cỏ đồng thành bụi','Đồng cỏ, rìa khu dân cư'],'grass-tall':['Cỏ cao','Ngoài lối chính, tránh khu báo đòn'],'grass-dry':['Cỏ khô','Bờ ruộng và chỗ ít ẩm'],'grass-reed':['Cói/lau thử','Ven suối, tránh hai đầu cầu'],'grass-clover':['Cỏ lá nhỏ sát đất','Chỗ râm và chân cây'],'flowers-white':['Hoa trắng','Ven trại và đường phụ'],'flowers-yellow':['Hoa vàng','Đồng cỏ và bờ ruộng'],'flowers-purple':['Hoa tím','Bìa rừng'],'flowers-buds':['Nụ xanh','Trạng thái hình riêng, chưa mô phỏng lớn lên'],'flowers-wilt':['Hoa héo','Dấu mùa/vùng đất, chưa tự đổi theo thời gian'],'flowers-sparse':['Hoa trắng thưa','Cụm nhỏ ít nhiễu gần nhà'],'leaves-oak':['Lá sồi','Hình cho lá bay/rơi trang trí'],'leaves-birch':['Lá bạch dương','Lá nhỏ vàng'],'leaves-willow':['Lá liễu','Dáng dài hẹp'],'leaves-litter':['Thảm lá khô','Decal mặt đất, không chặn hoặc tự tích vô hạn']};let items=[];function render(){const group=document.querySelector('#group').value,list=items.filter(i=>!group||i.group===group),host=document.querySelector('#cards');host.replaceChildren();document.querySelector('#count').textContent=list.length+' / '+items.length+' mẫu';for(const item of list){const a=document.createElement('article'),h=document.createElement('h2'),img=new Image(),p=document.createElement('p'),source=document.createElement('a');h.textContent=labels[item.id][0];img.src=item.image;img.alt=h.textContent;p.textContent=labels[item.id][1];source.href=item.source;source.textContent='Xem nguồn';a.append(h,img,p,source);host.append(a)}}document.querySelector('#group').onchange=render;try{items=(await fetch('flora-manifest.json').then(r=>r.json())).items;render()}catch(e){document.querySelector('#error').textContent='Chưa tải được thư viện: '+e.message}
</script></html>
