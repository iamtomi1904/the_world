<!doctype html><html lang="vi"><meta charset="utf-8"><title>Kỹ năng mới · Giữ Cổng Thành</title>
<style>body{margin:20px;background:#14251d;color:#f4dfad;font:16px system-ui}a{color:#abdfe6}main{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}article{background:#243a2b;border:1px solid #68764d;padding:12px;border-radius:10px}img{width:100%;height:155px;object-fit:contain}h2{font-size:16px;margin:8px 0}p{font-size:13px;line-height:1.5}@media(max-width:550px){main{grid-template-columns:repeat(2,minmax(0,1fr))}img{height:110px}}</style>
<h1>Kỹ năng đã vẽ lại</h1><p><a href="/effect-lab.html">Xem chuyển động</a> · <a href="/">Vào game</a> · <a href="/boss-gallery.html">Boss</a></p><main></main>
<script type="module">import {shadowIcon} from './shadow-art.js';import {SKILLS} from './skills.js';for(const c of ['darkelf','assassin','berserker','ranger','stormcaller','guardian','pyromancer','tidecaller'])for(const s of SKILLS.filter(s=>s.classId===c)){const a=document.createElement('article'),img=document.createElement(['assassin','darkelf'].includes(s.classId)?'span':'img'),h=document.createElement('h2'),p=document.createElement('p');img.src=['assassin','darkelf'].includes(s.classId)?'/assets/shadow/'+s.id+'.svg':'/assets/v4/'+s.id+'.png';img.alt=s.name;if(['assassin','darkelf'].includes(s.classId)){img.removeAttribute('src');img.style.cssText='display:block;width:128px;height:128px;margin:auto;image-rendering:pixelated';shadowIcon(img,s.id);}h.textContent=s.slot+' · '+s.name;p.textContent=s.text;a.append(img,h,p);document.querySelector('main').append(a);}</script></html>
