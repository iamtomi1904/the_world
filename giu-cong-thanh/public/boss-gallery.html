<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boss chiến dịch</title><style>body{background:#10211e;color:#ead8ad;font:16px system-ui;margin:30px auto;max-width:1200px;padding:0 20px}a{color:#edcc7c}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}article{background:#20372f;border:1px solid #647456;border-radius:12px;padding:18px}canvas{width:100%;height:210px;image-rendering:pixelated;background:radial-gradient(ellipse,#4c5140,transparent 70%)}h2{font-size:19px}p,li{line-height:1.6}small{color:#aabdb2}</style><h1>Thủ lĩnh của 10 chiến trường</h1><p>Sáu dòng boss: rồng, undead, rắn, sói, harpy và quái đá. Boss đợt cuối có 1–5 kỹ năng theo mốc. Hai đợt đầu ít hơn một kỹ năng, tối thiểu một. Báo trước 1,2 giây; dưới 40% máu boss ra chiêu nhanh hơn.</p><p><a href="/defense.html">Chơi giữ thành</a> · <a href="/boss-lab.html">Thử kỹ năng boss</a> · <a href="/bestiary.html">Bách khoa quái vật</a> · <a href="/">Trang chủ</a></p><main></main><script type="module">
import {BOSSES} from './bosses.js';import {BOSS_SKILLS,bossSkillCount} from './boss-skills.js';import {monsterPreview} from './monster-preview.js';
const catalog=await (await fetch('/catalog-v4.json')).json();
for(const [i,b]of BOSSES.entries()){const card=document.createElement('article'),canvas=document.createElement('canvas');canvas.width=320;canvas.height=210;canvas.setAttribute('aria-label',b.name);const n=bossSkillCount(i+1);card.innerHTML='<small>MỐC '+String(i+1).padStart(2,'0')+' · '+n+' KỸ NĂNG</small><h2>'+b.name+'</h2>';card.append(canvas);const ul=document.createElement('ul');for(const id of b.skills.slice(0,n)){const s=BOSS_SKILLS[id],li=document.createElement('li');li.textContent=s.name+' — '+(s.summon?'gọi '+s.count+' viện binh':s.heal?'hồi máu và tạo giáp':s.shield?'tạo giáp':s.frenzy?'cuồng nộ tăng tốc':s.meteor?'thiên thạch rơi':s.poison?'gây độc':s.slow?'gây sát thương và làm chậm':s.drain?'hút máu':s.duration?'vùng sát thương duy trì':s.dash?'lao tới vị trí đánh dấu':s.knockback?'đẩy lùi':s.shape==='cone'?'đòn hình quạt':s.shape==='ring'?'đòn vành khuyên':'sát thương vùng');ul.append(li);}card.append(ul);document.querySelector('main').append(card);monsterPreview(canvas,b.actor,catalog,{size:150});}
</script></html>
