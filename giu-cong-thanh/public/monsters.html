<!doctype html><html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>10 quái — Giữ Cổng Thành</title><link rel="icon" type="image/svg+xml" href="/favicon.svg?v=1"><style>body{background:#14201b;color:#e3ddc9;font:16px system-ui;margin:32px auto;max-width:1100px;padding:0 20px}h1{color:#d6bd7e}p{color:#aabca9}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:16px}figure{margin:0;background:#26372d;border:1px solid #526345;padding:15px}img{width:100%;aspect-ratio:1;object-fit:contain;image-rendering:pixelated;background:repeating-conic-gradient(#ffffff08 0% 25%,transparent 0% 50%) 0/20px 20px}figcaption{margin-top:10px}a{color:#d6bd7e}</style><a href="/">← Về game</a><h1>Quân đoàn vây thành</h1><p>10 tạo hình quái độc lập · PNG nền trong suốt · Hình đứng, chưa có animation.</p><main id="grid"></main><script>
const entries=[['slime','01 · Slime xương'],['goblin','02 · Goblin dao gỉ'],['skeleton','03 · Bộ xương chiến binh'],['zombie','04 · Xác sống'],['spider','05 · Nhện độc'],['bat','06 · Dơi hang'],['wolf','07 · Sói hoang'],['orc','08 · Orc chiến binh'],['dark-mage','09 · Pháp sư bóng tối'],['stone-golem','10 · Golem đá']];
for(const [id,name]of entries){const f=document.createElement('figure'),a=document.createElement('a'),i=document.createElement('img'),c=document.createElement('figcaption');a.href='/assets/monsters/'+id+'.png';i.src=a.href;i.alt=name;c.textContent=name;a.append(i);f.append(a,c);document.getElementById('grid').append(f);}
</script></html>
